services:

    db:
        image: mysql:8.4
        command: --sql-mode=NO_ENGINE_SUBSTITUTION
        environment:
            MYSQL_ROOT_PASSWORD: password
        volumes:
          - /Users/kraag22/projects/berlingame/db-data:/var/lib/mysql

    adminer:
        image: adminer
        ports:
          - 8080:8080

    server:
        build: ./php-mysql
        ports:
          - 3333:80
        volumes:
          - /Users/kraag22/projects/berlingame:/var/www/html/
